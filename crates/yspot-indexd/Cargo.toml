[package]
name = "yspot-indexd"
description = "YSpot index service: named pipe server over the in-memory index (SPEC.md §3, §4). M0: console mode."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
yspot-proto = { path = "../yspot-proto" }
yspot-pipe = { path = "../yspot-pipe" }
yspot-index = { path = "../yspot-index" }
anyhow.workspace = true
log.workspace = true
yspot-log = { path = "../yspot-log" }

# The pipe itself lives in yspot-pipe; the service only needs the error
# constants it matches on at startup.
[dependencies.windows-sys]
workspace = true
features = ["Win32_Foundation"]
