[package]
name = "yspot-indexd"
description = "YSpot index service: named pipe server over the in-memory index (SPEC.md §3, §4). M0: console mode."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
yspot-proto = { path = "../yspot-proto" }
yspot-index = { path = "../yspot-index" }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true

[dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_IO",
    # LocalFree lives in Win32::Foundation in windows-sys 0.59; the Memory
    # feature is a no-cost hedge in case the import needs to move.
    "Win32_System_Memory",
    "Win32_System_Threading",
]
