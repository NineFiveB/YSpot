[package]
name = "yspot-log"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
# `std` for `set_boxed_logger`. The shell only ever got it by feature
# unification with another dependency, which is not something to rely on in a
# crate whose entire job is to install a logger.
log = { workspace = true, features = ["std"] }
serde_json = "1"
