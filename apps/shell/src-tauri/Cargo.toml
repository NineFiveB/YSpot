[package]
name = "yspot-shell"
description = "YSpot shell: Tauri v2 host — global hotkey, launcher window, §5.2 focus model, indexd pipe client, §4.6 command surface (SPEC.md §5)."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "yspot_shell"

[features]
# Embedded-asset mode is the DEFAULT so a plain `cargo build --release`
# produces a launcher that serves the built frontend from the binary.
# Without this block, generate_context! silently falls back to the dev
# context and the release webview navigates to build.devUrl
# (http://localhost:5173) — a blank window on any machine not running the
# Vite dev server, which is exactly how every M0 measurement pass found it.
# `cargo tauri dev` disables default features itself and keeps using the
# dev server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { workspace = true }
serde_json = "1"
log = { workspace = true }
env_logger = { workspace = true }
yspot-proto = { path = "../../../crates/yspot-proto" }
yspot-pipe = { path = "../../../crates/yspot-pipe" }

[dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
