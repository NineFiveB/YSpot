[workspace]
resolver = "2"
members = [
    "crates/yspot-proto",
    "crates/yspot-index",
    "crates/yspot-indexd",
    "apps/shell/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["YSpot contributors"]
repository = "https://github.com/AegiosOT/YSpot"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }
thiserror = "2"
anyhow = "1"
memchr = "2"
log = "0.4"
env_logger = "0.11"
windows-sys = "0.59"

[profile.release]
lto = "thin"
codegen-units = 1
