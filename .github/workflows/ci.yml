name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # The shell crate embeds the built frontend via generate_context!, so
      # dist/ must exist before anything in the workspace is compiled.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/shell/package-lock.json

      - name: Build frontend
        working-directory: apps/shell
        run: |
          npm ci
          npm run build

      # The §5.11 merge/selection contract is normative and its failure mode
      # is silent (rows reordering under the user's cursor, selection quietly
      # pointing at a different item), so it has unit tests of its own.
      - name: Frontend tests
        working-directory: apps/shell
        run: npm test

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # SPEC §10 M0 wants measured evidence for the §3.4 matching path before
      # feature work proceeds. Advisory on purpose — no --strict yet: a shared,
      # throttled runner is not reference Machine A/B, so this is a regression
      # tripwire, not M0 sign-off. Flip to --strict once the numbers are stable.
      - name: "Matching benchmark (advisory)"
        shell: bash
        run: |
          cargo build -p yspot-index --bin bench --release
          ./target/release/bench.exe --entries 300000 --iterations 100 --json-out bench.json

      - name: Upload benchmark metrics
        uses: actions/upload-artifact@v4
        with:
          name: matching-bench
          path: bench.json
          if-no-files-found: error

  smoke:
    name: Indexer smoke test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Two steps, deliberately: in one pwsh script only the LAST native exit
      # code decides the step's outcome, so a failed first build would ride a
      # green second one and resurface later as "probe.exe not found".
      - name: Build indexd (with probe)
        run: cargo build -p yspot-indexd --release

      - name: Build m0 harness
        run: cargo build -p yspot-m0 --release

      # Runners are NTFS and the job is elevated, so both indexing paths are
      # exercisable here even though a locked-down dev machine cannot run
      # unsigned binaries locally.
      #
      # A CLIENT CONNECTS in this step, deliberately. The previous shape of
      # this test — start the service and grep its log — passed while every
      # search deadlocked (the synchronous-pipe bug found the day a real
      # client first connected). `probe` speaks the §4 protocol exactly as the
      # shell does: handshake, IndexStatus, SearchQuery → final SearchResults,
      # so a service that cannot answer a search fails CI here. `--burst 50`
      # is the §4.4 supersession check (issue #9): 50 generations written
      # before any is read must come back in order, ending with the last one —
      # which requires the service to keep reading while it searches.
      - name: Walk-mode index + probe answers over the pipe
        shell: pwsh
        timeout-minutes: 10
        run: |
          $exe = "target/release/yspot-indexd.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--walk", "$env:RUNNER_TEMP" `
            -PassThru -RedirectStandardOutput walk.log -RedirectStandardError walk.err
          # Poll for readiness rather than sleeping a flat interval.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
            if ($proc.HasExited) {
              Write-Host "indexd exited early with code $($proc.ExitCode)"
              Get-Content walk.log, walk.err -ErrorAction SilentlyContinue
              exit 1
            }
            $sofar = @(Get-Content walk.log, walk.err -ErrorAction SilentlyContinue) -join "`n"
            if ($sofar -match "pipe server listening") { break }
          }

          # Run probe with its own timeout: its reads block with no deadline,
          # so a service that accepts the connection but never answers — the
          # exact dd228ee failure class this step exists to catch — would
          # otherwise stall to the step timeout and skip every diagnostic
          # below. 124, in the timeout(1) tradition.
          $probe = Start-Process -FilePath "target/release/probe.exe" `
            -ArgumentList "--iterations", "20", "--burst", "50" -PassThru -NoNewWindow
          if ($probe.WaitForExit(120000)) {
            $probeExit = $probe.ExitCode
          } else {
            Stop-Process -Id $probe.Id -Force -ErrorAction SilentlyContinue
            $probeExit = 124
          }

          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Get-Content walk.log, walk.err -ErrorAction SilentlyContinue
          # env_logger writes to stderr, so assert against both streams.
          $out = @(Get-Content walk.log, walk.err -ErrorAction SilentlyContinue) -join "`n"
          foreach ($expected in @("walk complete", "pipe server listening")) {
            if ($out -notmatch [regex]::Escape($expected)) {
              Write-Host "::error::indexd never logged '$expected'"
              exit 1
            }
          }
          if ($out -match "NOT ACL-hardened") {
            Write-Host "::error::pipe fell back to DEFAULT security instead of the dev DACL"
            exit 1
          }
          if ($probeExit -ne 0) {
            Write-Host "::error::probe could not complete a search round-trip (exit $probeExit)"
            exit 1
          }

      # §10 M0 flagged open item #1. Advisory on the first rollout: a shared
      # runner's clipboard service is not under our control; the dev-machine
      # run in docs/M0.md is the sign-off signal. Tighten once green history
      # shows the runner is reliable here.
      - name: "Clipboard-listener smoke test (advisory)"
        shell: pwsh
        timeout-minutes: 2
        run: target/release/yspot-m0.exe clipboard
        continue-on-error: true

      - name: "MFT enumeration of C: (timing for SPEC §10 M0)"
        shell: pwsh
        run: |
          $exe = "target/release/yspot-indexd.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--mft", "C:" `
            -PassThru -RedirectStandardOutput mft.log -RedirectStandardError mft.err
          # Enumeration reports every 2 s, so a partial run still yields a rate.
          # Poll for completion rather than sleeping a flat interval.
          $deadline = (Get-Date).AddSeconds(240)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
            $sofar = @(Get-Content mft.log, mft.err -ErrorAction SilentlyContinue) -join "`n"
            if ($sofar -match "enumerated C:") { break }
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          Get-Content mft.log, mft.err -ErrorAction SilentlyContinue
          # Informational: CI runners are shared VMs, so timings here are an
          # upper bound, not the SPEC §10 reference-machine measurement.
        continue-on-error: true
